<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>JustUs</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e1420; overflow: hidden; }
    .bar {
      height: 32px; display: flex; align-items: center; gap: 8px;
      padding: 0 150px 0 10px; /* right padding leaves room for the native min/max/close buttons */
      color: #fff; font: 500 12.5px "Segoe UI Variable Text", "Segoe UI", sans-serif;
      -webkit-app-region: drag; user-select: none;
    }
    .bar img { width: 16px; height: 16px; border-radius: 4px; }
    .badge {
      display: none; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box;
      border-radius: 9px; background: #25d366; color: #0b141a; font-size: 11px; font-weight: 700;
      align-items: center; justify-content: center;
    }
    .badge.on { display: inline-flex; }
    .spacer { flex: 1; }
    button {
      -webkit-app-region: no-drag; background: transparent; border: 0; color: #cbbbe8;
      width: 30px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: rgba(255,255,255,0.12); color: #fff; }
  </style>
</head>
<body>
  <div class="bar">
    <img src="tray.png" alt="" />
    <span>JustUs</span>
    <span id="badge" class="badge"></span>
    <span class="spacer"></span>
    <button id="reload" title="Reload (Ctrl+R)">&#x21bb;</button>
  </div>
  <script>
    const badgeEl = document.getElementById('badge');
    document.getElementById('reload').addEventListener('click', () => window.titlebar.reload());

    function renderBadgePng(count) {
      const size = 32, c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#e53935';
      ctx.beginPath(); ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${count > 9 ? 17 : 21}px "Segoe UI", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(count > 99 ? '99+' : String(count), size / 2, size / 2 + 1);
      return c.toDataURL('image/png');
    }

    window.titlebar.onUnread((count) => {
      badgeEl.textContent = count > 99 ? '99+' : String(count);
      badgeEl.classList.toggle('on', count > 0);
      if (count > 0) window.titlebar.sendBadge(renderBadgePng(count), count);
    });
  </script>
</body>
</html>
